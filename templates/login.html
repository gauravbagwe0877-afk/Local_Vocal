{% extends 'base.html' %}
{% block title %}Login — Local Vocal Sawantwadi{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-deco">
        <div class="auth-orb auth-orb-1"></div>
        <div class="auth-orb auth-orb-2"></div>
    </div>
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">🏘️</div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-sub">Sign in to share your Sawantwadi experiences</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label class="form-label">Username or Email</label>
                <input type="text" name="username" class="form-input" placeholder="your_username" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="password-wrap">
                    <input type="password" name="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
                    <button type="button" class="pwd-toggle" onclick="togglePwd('loginPassword', this)">👁</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full btn-lg">Sign In</button>
        </form>

        <div class="auth-divider"><span>or</span></div>
        <div class="auth-switch">
            New to Local Vocal? <a href="{{ url_for('register') }}">Create an account</a>
        </div>

        <div class="demo-creds">
            <div class="demo-title">Demo Accounts</div>
            <div class="demo-grid">
                <div class="demo-item">
                    <strong>Admin:</strong> admin / admin123
                </div>
                <div class="demo-item">
                    <strong>User:</strong> priya_sawant / test1234
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
