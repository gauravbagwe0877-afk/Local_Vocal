{% extends 'base.html' %}
{% block title %}Join Local Vocal — Sawantwadi{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-deco">
        <div class="auth-orb auth-orb-1"></div>
        <div class="auth-orb auth-orb-2"></div>
    </div>
    <div class="auth-card auth-card-wide">
        <div class="auth-header">
            <div class="auth-logo">🏘️</div>
            <h1 class="auth-title">Join Local Vocal</h1>
            <p class="auth-sub">Become part of Sawantwadi's review community</p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-input" placeholder="Priya Sawant" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-input" placeholder="priya_sawant" required minlength="3">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-input" placeholder="priya@example.com" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="password-wrap">
                        <input type="password" name="password" id="regPassword" class="form-input" placeholder="Min. 6 characters" required minlength="6">
                        <button type="button" class="pwd-toggle" onclick="togglePwd('regPassword', this)">👁</button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-input" placeholder="Repeat password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full btn-lg">Create Account</button>
        </form>

        <div class="auth-divider"><span>or</span></div>
        <div class="auth-switch">
            Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
