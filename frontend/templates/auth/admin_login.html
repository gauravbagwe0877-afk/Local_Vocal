{% extends 'base.html' %}
{% block title %}Administrator Portal — StaySmart Hotel{% endblock %}

{% block content %}
<div class="auth-page" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 40px 16px;">
    <div style="background: var(--color-surface); border: 2px solid var(--color-primary); border-radius: 16px; box-shadow: 0 16px 40px rgba(181,69,27,0.12); max-width: 440px; width: 100%; padding: 36px; box-sizing: border-box;">
        
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="width: 52px; height: 52px; border-radius: 12px; background: var(--color-primary); color: #fff; font-size: 1.6rem; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 12px;">
                ⚙️
            </div>
            <h2 style="font-family: var(--font-headings); margin: 0 0 6px; font-size: 1.6rem; color: var(--color-primary);">Admin Portal</h2>
            <p style="color: var(--color-muted); font-size: 0.88rem; margin: 0;">StaySmart Hotel Executive Management</p>
        </div>

        <div style="background: rgba(181,69,27,0.08); border-left: 3px solid var(--color-primary); padding: 10px 14px; border-radius: 6px; font-size: 0.8rem; color: var(--color-text); margin-bottom: 20px;">
            🔒 <strong>Restricted Access:</strong> For authorized hotel owners & general managers only.
        </div>

        <form method="POST" action="{{ url_for('auth.admin_login') }}">
            <div class="pms-floating-label">
                <input type="text" name="username" required placeholder=" " autofocus value="admin">
                <label>Admin Username or Email</label>
            </div>

            <div class="pms-floating-label" style="margin-top: 16px;">
                <input type="password" name="password" required placeholder=" " value="admin123">
                <label>Admin Password</label>
            </div>

            <button type="submit" class="btn-pms btn-pms-primary" style="width: 100%; padding: 12px; font-size: 0.95rem; margin-top: 12px; background: var(--color-primary);">
                Authenticate as Admin &rarr;
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.82rem; color: var(--color-muted); border-top: 1px solid var(--color-border); padding-top: 16px; display: flex; justify-content: space-between;">
            <a href="{{ url_for('auth.receptionist_login') }}" style="color: var(--color-muted); text-decoration: none;">Receptionist Portal</a>
            <a href="{{ url_for('auth.customer_login') }}" style="color: var(--color-primary); text-decoration: none;">Customer Portal</a>
        </div>
    </div>
</div>
{% endblock %}
