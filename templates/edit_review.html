{% extends 'base.html' %}
{% block title %}Edit Review — Local Vocal{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card auth-card-wide">
        <div class="auth-header">
            <div class="auth-logo">✍️</div>
            <h1 class="auth-title">Edit Your Review</h1>
            <p class="auth-sub">Updating review for <strong>{{ place.name }}</strong></p>
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label class="form-label">Rating</label>
                <div class="star-picker" id="starPicker">
                    {% for i in range(1, 6) %}
                    <input type="radio" name="rating" id="star{{ i }}" value="{{ i }}"
                           {% if review.rating == i %}checked{% endif %} required>
                    <label for="star{{ i }}" class="star-pick">★</label>
                    {% endfor %}
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Review Title</label>
                <input type="text" name="title" class="form-input"
                       value="{{ review.title }}" required maxlength="120">
            </div>

            <div class="form-group">
                <label class="form-label">Your Review</label>
                <textarea name="body" class="form-input form-textarea" required rows="6">{{ review.body }}</textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-lg">Update Review</button>
                <a href="{{ url_for('place_detail', place_id=place.id) }}" class="btn btn-outline btn-lg">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
