{% extends 'base.html' %}
{% block title %}Guest Login — StaySmart Hotel{% endblock %}

{% block content %}
<div class="auth-page" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 40px 16px;">
    <div style="background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 16px; box-shadow: 0 16px 40px rgba(0,0,0,0.06); max-width: 440px; width: 100%; padding: 36px; box-sizing: border-box;">
        
        <div style="text-align: center; margin-bottom: 24px;">
            <div style="width: 52px; height: 52px; border-radius: 12px; background: linear-gradient(135deg, var(--color-primary), var(--color-accent)); color: #fff; font-size: 1.6rem; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; margin-bottom: 12px;">
                👤
            </div>
            <h2 style="font-family: var(--font-headings); margin: 0 0 6px; font-size: 1.6rem; color: var(--color-text);">Guest Sign In</h2>
            <p style="color: var(--color-muted); font-size: 0.88rem; margin: 0;">Access your bookings, receipts & room reservations</p>
        </div>

        <form method="POST" action="{{ url_for('auth.customer_login') }}">
            <div class="pms-floating-label">
                <input type="text" name="username" required placeholder=" " autofocus value="customer">
                <label>Username or Email Address</label>
            </div>

            <div class="pms-floating-label" style="margin-top: 16px;">
                <input type="password" name="password" required placeholder=" " value="customer123">
                <label>Account Password</label>
            </div>

            <button type="submit" class="btn-pms btn-pms-primary" style="width: 100%; padding: 12px; font-size: 0.95rem; margin-top: 12px;">
                Sign In to Guest Dashboard &rarr;
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--color-muted); border-top: 1px solid var(--color-border); padding-top: 18px;">
            First time booking with StaySmart? 
            <a href="{{ url_for('auth.customer_register') }}" style="color: var(--color-primary); font-weight: 600;">Create Guest Account &rarr;</a>
        </div>

        <div style="text-align: center; margin-top: 16px; font-size: 0.8rem; color: var(--color-muted);">
            Staff members: <a href="{{ url_for('auth.receptionist_login') }}" style="color: var(--color-secondary);">Receptionist Portal</a> | <a href="{{ url_for('auth.admin_login') }}" style="color: var(--color-primary);">Admin</a>
        </div>
    </div>
</div>
{% endblock %}
